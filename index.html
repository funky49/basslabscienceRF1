<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Oobleck Dance Generator 1.6g</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header id="mainHeader">
        <canvas id="waveCanvas"></canvas>
        <div id="freqFill"></div>
        <div class="header-content">
            <div id="leftArrow" class="header-arrow">← 25Hz</div>
            <div id="headerText" class="header-text">
                <span class="warning-title">WARNING</span><br>
                <span class="warning-sub">(not gentle to speakers)</span>
            </div>
            <div id="rightArrow" class="header-arrow">75Hz →</div>
        </div>
    </header>

    <nav class="main-tabs">
        <button type="button" id="tab-generator" class="tab-btn active-tab">Generator Mode</button>
        <button type="button" id="tab-song" class="tab-btn">Song Mode</button>
        <button type="button" id="tab-toy" class="tab-btn">Toy Mode</button>
    </nav>

    <main id="appContent">

        <section id="mode-generator" class="content-panel active-panel">
            <nav class="sub-tabs">
                <button type="button" id="sub-tone" class="sub-btn flashing">TONE</button>
                <button type="button" id="sub-sweep" class="sub-btn">SWEEP</button>
                <button type="button" id="sub-keyboard" class="sub-btn">KEYBOARD</button>
                <button type="button" id="sub-off" class="sub-btn off-btn">OFF</button>
            </nav>

            <div class="generator-workspace">
                <div id="ui-tone" class="gen-ui active-gen-ui">
                    <div class="tone-controls">
                        <button type="button" class="nudge-btn" id="btnFreqDown">−</button>
                        <div class="knob-container" id="mainKnob">
                            <div class="knob-indicator" id="knobPointer"></div>
                            <div class="knob-readout">
                                <span id="toneHzReadout">49.0</span><br><span class="unit">Hz</span>
                            </div>
                        </div>
                        <button type="button" class="nudge-btn" id="btnFreqUp">+</button>
                    </div>
                </div>

                <div id="ui-sweep" class="gen-ui">
                    <div class="sweep-controls">
                        <div class="slider-group">
                            <label>Median Freq: <span id="valMedian">49</span> Hz</label>
                            <input type="range" id="slMedian" min="35" max="65" step="0.5" value="49">
                        </div>
                        <div class="slider-group">
                            <label>Freq Range Span: <span id="valRange">6</span> Hz</label>
                            <input type="range" id="slRange" min="3" max="10" step="0.5" value="6">
                        </div>
                        <div class="slider-group">
                            <label>Sweep Time: <span id="valTime">7</span> s</label>
                            <input type="range" id="slTime" min="3" max="10" step="0.5" value="7">
                        </div>
                        <p class="sweep-hint">Slide and release to trigger sweep.</p>
                    </div>
                </div>

                <div id="ui-keyboard" class="gen-ui">
                    <div id="pianoContainer"></div>
                </div>
            </div>
        </section>

        <section id="mode-song" class="content-panel">
            <div class="grid-8" id="songGrid"></div>
        </section>

        <section id="mode-toy" class="content-panel">
            <div class="grid-8">
                <button type="button" class="toy-btn" data-toy="rise">Bass Rise</button>
                <button type="button" class="toy-btn" data-toy="drop">mmm Drop</button>
                <button type="button" class="toy-btn" data-stop-all>TBD Audio Loop</button>
                <button type="button" class="toy-btn" data-stop-all>TBD Audio Loop</button>
                <button type="button" class="toy-btn" data-stop-all>TBD Audio Loop</button>
                <button type="button" class="toy-btn" data-stop-all>TBD Audio Loop</button>
                <button type="button" class="toy-btn" data-stop-all>TBD</button>
                <button type="button" class="toy-btn" id="btn-readme">Info & Thanks</button>
            </div>
            <div id="readmeDisplay" class="readme-box"></div>
        </section>

    </main>

    <footer id="mainFooter">
        <button type="button" class="global-stop-btn">STOP ALL AUDIO</button>
    </footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
